<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - De-Risk AI</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Head Route Guard (Instant Redirect to Dashboard if Logged In) -->
  <script>
    (function() {
      const token = localStorage.getItem("token");
      const user = localStorage.getItem("user");
      if (token && user) {
        window.location.href = "/dashboard";
      }
    })();
  </script>
</head>
<body class="auth-page">

  <!-- AI Interactive Spotlight Grid Background Overlay -->
  <div class="bg-grid-overlay"></div>

  <div class="auth-wrapper">
    <div class="glass-card auth-card animate-fade-in">
      <div class="auth-header">
        <div class="auth-logo">
          <!-- Logo warning shield -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">De-Risk AI Feasibility Audit Console</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Corporate Email</label>
          <input class="input-field" type="email" id="email" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
          <label class="form-label" for="password">Password</label>
          <input class="input-field" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button class="btn-primary" type="submit" id="submit-btn">
          <span>Sign In</span>
          <div class="spinner-ring"></div>
        </button>
      </form>

      <div class="auth-footer">
        Don't have access? <a class="auth-link" href="/signup">Create account</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="auth.js"></script>
</body>
</html>
