<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - De-Risk AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <!-- AI Interactive Spotlight Grid Background Overlay -->
  <div class="bg-grid-overlay"></div>

  <div class="auth-wrapper">
    <div class="glass-card auth-card animate-fade-in">
      <div class="auth-header">
        <div class="auth-logo">
          <!-- Logo warning shape -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Initialize your diagnostic access token</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="email">Corporate Email</label>
          <input class="input-field" type="email" id="email" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="input-field" type="password" id="password" placeholder="Min. 6 characters" required autocomplete="new-password">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input class="input-field" type="password" id="confirm-password" placeholder="Re-enter password" required autocomplete="new-password">
        </div>

        <button class="btn-primary" type="submit" id="submit-btn">
          <span>Create Account</span>
          <div class="spinner-ring"></div>
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a class="auth-link" href="/login">Sign in here</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="auth.js"></script>
</body>
</html>
